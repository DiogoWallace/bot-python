name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Biblioteca ODBC (o pyodbc precisa dela para ser importado)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unixodbc
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Pytest (banco falso, sem SQL Server)
        run: pytest -q
